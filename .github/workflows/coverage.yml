name: Coverage

on:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test script with coverage reporting
        run: npm run test-coverage

      - name: Upload code coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          file: ./coverage_report/lcov.info
          coverage-reporter-version: v0.6.22
