name: Tag exists
description: Checks if the provided tag exists

inputs:
  tag:
    type: string
    required: true

outputs:
  exists:
    value: ${{ steps.check-tag-exists.outputs.exists }}

runs:
  using: composite
  steps:
    - id: check-tag-exists
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          exists=true
        else
          exists=false
        fi
        echo "Tag '$TAG' exists: $exists"
        echo "exists=$exists" >> "$GITHUB_OUTPUT"
